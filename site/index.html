<meta charset="utf-8">
<title>Артём Нуриев</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Артём Нуриев — продуктовый дизайнер в X5 Digital">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Roboto+Mono:wght@400&display=swap">
<style>
  /* Layout: один экран — заголовок сверху по центру, лента работ снизу во всю ширину, линза по краям */
  :root {
    --bg-top: #0a0a0a;
    --bg-bottom: #202020;
    --ink: #ffffff;
    --ink-dim: rgba(255, 255, 255, 0.5);
    --ring: #0a0a0a;
    --slot: #2a2a2c;
    --font-display: "Instrument Serif", "Times New Roman", Georgia, serif;
    --font-mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed, var(--bg-top);
    color: var(--ink);
    font-family: var(--font-mono);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0;
    overflow: hidden;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 3.7vh, 38px);
    padding-block: clamp(40px, 6.6vh, 68px) 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }

  /* Заголовок: 90px на макете 1440 → 6.25vw */
  .headline {
    margin: 0;
    max-width: 10.5em;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(40px, 6.25vw, 90px);
    line-height: 0.9;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .inline-media {
    display: inline-flex;
    vertical-align: top;
    position: relative;
    top: 0.178em;
    box-sizing: border-box;
  }

  /* Фото: 55px при 90px кегле */
  .me {
    width: 0.611em;
    height: 0.611em;
    margin-inline: 0.111em;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 35% 30%, #4a4a4e, var(--slot));
  }
  .me img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .me:not(.empty) .initials { display: none; }
  .me .initials {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font: 400 0.18em/1 var(--font-mono);
    color: var(--ink-dim);
    -webkit-text-fill-color: var(--ink-dim);
  }

  /* Плашка с логотипами продуктов */
  .pill {
    align-items: center;
    margin-inline: 0.111em;
    padding: 0.115em;
    border: max(1px, 0.0115em) solid var(--ink);
    border-radius: 999px;
  }
  .dot {
    width: 0.369em;
    height: 0.369em;
    margin-right: -0.069em;
    border: max(1.5px, 0.023em) solid var(--ring);
    box-sizing: border-box;
    border-radius: 50%;
    overflow: hidden;
    background: var(--slot);
    flex: none;
  }
  .dot:last-child { margin-right: 0; }
  .dot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dot.empty:nth-child(1) { background: #3d4a3f; }
  .dot.empty:nth-child(2) { background: #4f3434; }
  .dot.empty:nth-child(3) { background: #344a3c; }
  .dot.empty:nth-child(4) { background: #4d4630; }
  .dot.empty:nth-child(5) { background: #4f3a2f; }

  .lead {
    margin: 0;
    max-width: 32.65em; /* 555px при 17px */
    /* макет: 17px при заголовке 90px — то же соотношение 1 : 5.3 на любой ширине, но не мельче 12px */
    font-size: clamp(12px, 1.18vw, 17px);
    line-height: 1.5;
    color: var(--ink-dim);
    text-wrap: balance;
  }

  /* Лента работ */
  .reel {
    position: relative;
    width: 100%;
    flex: none;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .reel.dragging { cursor: grabbing; }
  /* сцена во весь экран за текстом: ближние к камере карточки выходят за полосу ленты */
  #gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 0;
  }
  .hero, .reel, .sig { position: relative; z-index: 1; }
  .reel:focus-visible { outline: 1px solid var(--ink-dim); outline-offset: -1px; }

  .reel-fallback {
    display: flex;
    gap: 17px;
    width: max-content;
    height: 100%;
    align-items: center;
    animation: marquee 60s linear infinite;
  }
  .reel-fallback img {
    width: var(--card-w, 264px);
    height: auto;
    border-radius: 20%/15%;
    box-shadow: 0 8px 120px rgba(0, 0, 0, 0.6);
  }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* подпись внизу по центру: margin-top: auto прижимает её к низу экрана */
  .reel { margin-top: var(--reel-gap); }
  :root { --reel-gap: clamp(48px, 8vh, 100px); }
  .sig {
    margin: auto 0 0;
    padding-top: 16px;
    padding-block: 0 clamp(20px, 3.5vh, 36px);
    text-align: center;
    font-size: clamp(10px, 0.76vw, 11px);   /* всегда мельче подзаголовка */
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.28);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---------- движение ----------
     появление: заголовок проявляется из лёгкого размытия, фото и логотипы «выпрыгивают» по очереди,
     дальше подзаголовок, лента и подпись. Ховеры: фото чуть поворачивается, логотип под курсором приподнимается.
     Ховеры меняют только transform — размеры не меняются, текст не переносится */
  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .me img, .dot img { transition: transform 0.6s var(--ease-spring); }
  .dot { transition: transform 0.5s var(--ease-spring); }
  .me:hover img { transform: scale(1.1) rotate(-6deg); }
  .pill .dot:hover { transform: translateY(-0.07em) scale(1.08); }

  /* ---------- просмотр работы ----------
     макет 1440×1024: экран 375×812 слева, справа текст 440px и кнопка; между ними 130px.
     --k масштабирует всё под высоту окна */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 50;
    --k: 1;
    --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  .viewer-backdrop {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 96% 96% at 50% 50%, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0.6) 100%);
  }
  .viewer-layout {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(130px * var(--k));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .viewer-slot { width: calc(375px * var(--k)); height: calc(812px * var(--k)); flex: none; }
  .viewer-info {
    width: calc(440px * var(--k));
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: calc(76px * var(--k));
  }
  .viewer-title {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .viewer-desc {
    margin: 0;
    font: 400 calc(26px * var(--k)) / 1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: #a6a6a6;
    text-wrap: pretty;
  }
  .viewer-cta {
    display: inline-flex;
    align-items: center;
    gap: calc(17px * var(--k));
    padding: calc(25.6px * var(--k)) calc(51px * var(--k)) calc(29px * var(--k));
    border-radius: 999px;
    background: #fff;
    color: #000;
    font: 400 calc(41px * var(--k)) / 1.3 var(--font-display);
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-out);
  }
  .viewer-cta-icon {
    width: calc(34.45px * var(--k));
    height: calc(28.55px * var(--k));
    fill: currentColor;
    transition: transform 0.5s var(--ease-spring);
  }
  .viewer-cta:hover { transform: scale(1.04); box-shadow: 0 0 60px rgba(255, 255, 255, 0.18); }
  .viewer-cta:hover .viewer-cta-icon { transform: translate(3px, -3px) rotate(-8deg); }
  .viewer-cta:active { transform: scale(0.97); }
  .viewer-cta:focus-visible, .viewer-close:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .viewer-media {
    position: fixed;
    left: 0; top: 0; width: 0; height: 0;
    perspective: 1200px;
    pointer-events: none;
  }
  .viewer-media-inner {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    background: #111;
    box-shadow: 0 6px 196px rgba(0, 0, 0, 0.6);
    transition: transform 0.6s var(--ease-out);
  }
  .viewer-media-inner { background-size: cover; background-position: center; }
  .viewer-media-inner > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  .viewer-close {
    position: absolute;
    top: calc(24px + env(safe-area-inset-top, 0px));
    right: max(24px, calc(env(safe-area-inset-right, 0px) + 16px));
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    color: #fff;
    cursor: pointer;
    transition: transform 0.5s var(--ease-spring), background 0.3s, border-color 0.3s;
  }
  .viewer-close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.6; fill: none; }
  .viewer-close:hover { transform: rotate(90deg); background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.4); }

  .viewer-hint {
    position: absolute;
    left: max(24px, calc(env(safe-area-inset-left, 0px) + 16px));
    top: calc(38px + env(safe-area-inset-top, 0px));
    margin: 0;
    font: 400 12px/1.3 var(--font-mono);
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
  }

  /* курсор-стрелка: показывает, куда перелистнёт клик */
  .viewer-cursor {
    position: fixed;
    left: 0; top: 0;
    width: 34px; height: 36px;
    margin: -18px 0 0 -17px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .viewer-cursor svg {
    width: 100%; height: 100%;
    fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.45s var(--ease-spring);
  }
  .viewer-cursor.prev svg { transform: scaleX(-1); }
  .viewer-cursor.press svg { transform: translateX(6px) scale(0.86); }
  .viewer-cursor.prev.press svg { transform: scaleX(-1) translateX(6px) scale(0.86); }
  @media (hover: hover) and (pointer: fine) {
    .viewer.has-cursor { cursor: none; }
    .viewer.has-cursor .viewer-cursor { opacity: 1; }
    .viewer.has-cursor.over-ui .viewer-cursor { opacity: 0; }
  }

  /* появление элементов просмотра */
  .viewer-backdrop, .viewer-info > *, .viewer-close, .viewer-hint { transition: opacity 0.5s var(--ease-out), transform 0.7s var(--ease-expo), filter 0.7s var(--ease-expo); }
  .viewer:not(.open) .viewer-backdrop { opacity: 0; }
  .viewer:not(.open) .viewer-info > *, .viewer .viewer-info.swap > * { opacity: 0; transform: translateY(14px); filter: blur(6px); }
  .viewer.open .viewer-desc { transition-delay: 0.22s; }
  .viewer.open .viewer-cta { transition-delay: 0.32s, 0.32s, 0.32s; }
  .viewer:not(.open) .viewer-close, .viewer:not(.open) .viewer-hint { opacity: 0; }
  .viewer.open .viewer-close { transition-delay: 0.35s; }
  .viewer.closing .viewer-info > *, .viewer .viewer-info.swap > * { transition-delay: 0s; transition-duration: 0.22s; }

  @media (max-width: 700px) {
    .viewer-layout { flex-direction: column; gap: 22px; padding-block: 72px 56px; }
    .viewer-slot { height: min(56vh, 520px); width: calc(min(56vh, 520px) * 0.4618); }
    .viewer-info { width: min(100%, 440px); align-items: center; gap: 18px; text-align: center; }
    .viewer-desc { font-size: 15px; }
    .viewer-cta { font-size: 24px; gap: 10px; padding: 12px 26px 14px; }
    .viewer-cta-icon { width: 20px; height: 17px; }
    .viewer-hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .viewer *, .viewer { transition-duration: 0.01s !important; transition-delay: 0s !important; }
  }

  /* ---------- страница с паролем ----------
     макет: заголовок 90px, под ним 52px, подпись 17px, 4 ячейки 49×65 через 36px.
     Фон — строки «кода», которые медленно плывут, центр затемнён */
  html.locked body { overflow: hidden; }
  html.locked .stage { visibility: hidden; }
  html.locked .stage * { animation-play-state: paused !important; }
  .gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .gate[hidden], .viewer[hidden] { display: none; }
  .gate-code {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font: 400 clamp(16px, 1.87vw, 27px) / 1.8 var(--font-mono);
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  .gate-row { display: flex; width: max-content; animation: gate-drift var(--d, 90s) linear infinite; }
  .gate-row:nth-child(even) { animation-direction: reverse; }
  .gate-row span { padding-right: 2ch; }
  @keyframes gate-drift { from { transform: translateX(var(--x0, -10%)); } to { transform: translateX(calc(var(--x0, -10%) - 50%)); } }
  .gate-shade {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 125% 86% at 50% 50%, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0.978) 35%, rgba(10, 10, 10, 0.6) 100%);
    pointer-events: none;
  }
  .gate-body {
    position: relative;
    width: min(738px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(32px, 3.6vw, 52px);
  }
  .gate-title {
    margin: 0;
    font: 400 clamp(44px, 6.25vw, 90px) / 0.9 var(--font-display);
    text-align: center;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  @media (max-width: 700px) { .gate-title { text-wrap: balance; } }
  .gate-form { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .gate-label {
    margin: 0;
    font: 400 clamp(13px, 1.18vw, 17px) / 1.5 var(--font-mono);
    color: var(--ink-dim);
    transition: color 0.3s;
  }
  .gate.error .gate-label { color: rgba(255, 99, 99, 0.5); }
  .gate-cells { position: relative; display: flex; gap: clamp(16px, 2.5vw, 36px); }
  .gate-cell {
    position: relative;
    width: 49px;
    height: 65px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.01);
    transition: border-color 0.3s, background 0.3s, transform 0.5s var(--ease-spring);
  }
  .gate-cell::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: #fff;
    transform: scale(0);
    transition: transform 0.45s var(--ease-spring), background 0.3s;
  }
  .gate-cell.filled::before { transform: scale(1); }
  .gate-cell.filled { border-color: rgba(255, 255, 255, 0.35); }
  /* каретка в активной ячейке */
  .gate-cell::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 3px; height: 27px;
    margin: -13.5px 0 0 -1.5px;
    border-radius: 30px;
    background: #fff;
    opacity: 0;
  }
  .gate.focused .gate-cell.active::after { animation: gate-caret 1.05s steps(1) infinite; }
  @keyframes gate-caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .gate.error .gate-cell::before { background: #ff6363; }
  .gate.error .gate-cells { animation: gate-shake 0.5s var(--ease-out); }
  @keyframes gate-shake {
    0%, 100% { transform: none; }
    15% { transform: translateX(-10px); }
    35% { transform: translateX(8px); }
    55% { transform: translateX(-5px); }
    75% { transform: translateX(3px); }
  }
  .gate.ok .gate-cell { border-color: rgba(255, 255, 255, 0.6); transform: translateY(-4px); }
  .gate.ok .gate-cell:nth-child(2) { transition-delay: 0.04s; }
  .gate.ok .gate-cell:nth-child(3) { transition-delay: 0.08s; }
  .gate.ok .gate-cell:nth-child(4) { transition-delay: 0.12s; }
  .gate-input {
    position: absolute;
    inset: -8px;
    width: calc(100% + 16px);
    opacity: 0;
    border: 0;
    font-size: 16px;   /* иначе iOS приближает страницу при фокусе */
    color: transparent;
    background: transparent;
    caret-color: transparent;
    cursor: pointer;
  }
  .gate-input:focus-visible { outline: none; }
  .gate.focused .gate-cells { filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.06)); }

  /* появление и уход страницы с паролем */
  .gate-title, .gate-form { transition: opacity 0.7s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out); }
  .gate.leaving { transition: opacity 0.9s var(--ease-out) 0.35s; opacity: 0; pointer-events: none; }
  .gate.leaving .gate-title, .gate.leaving .gate-form { opacity: 0; transform: translateY(-16px) scale(0.98); filter: blur(10px); }
  .gate.leaving .gate-form { transition-delay: 0.05s; }
  @media (prefers-reduced-motion: no-preference) {
    .gate-title { animation: rise 1.1s var(--ease-out) 0.1s both; }
    .gate-form  { animation: rise 1s var(--ease-out) 0.35s both; }
    .gate-code  { animation: fade 1.6s var(--ease-out) both; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gate-row { animation: none; }
  }

  /* вход «сборка»: пока скрипт готовит буквы, шапка скрыта */
  html.fly .hero { visibility: hidden; }
  html.flying .headline, html.flying .lead, html.flying .me, html.flying .pill, html.flying .dot { animation: none !important; }
  html.flying .headline { background: none; -webkit-text-fill-color: transparent; }
  .ch { position: relative; }
  .ch > i {
    position: absolute;
    left: 0; top: 0;
    font-style: normal;
    white-space: pre;
    -webkit-text-fill-color: currentColor;
    will-change: transform, opacity;
    pointer-events: none;
  }
  html.flying .lead .ch { color: transparent; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.3); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .headline { animation: rise 1.1s var(--ease-out) 0.05s both; }
    .me       { animation: pop 0.7s var(--ease-spring) 0.5s both; }
    .pill     { animation: fade 0.5s var(--ease-out) 0.55s both; }
    .dot      { animation: pop 0.6s var(--ease-spring) both; }
    .dot:nth-child(1) { animation-delay: 0.62s; }
    .dot:nth-child(2) { animation-delay: 0.69s; }
    .dot:nth-child(3) { animation-delay: 0.76s; }
    .dot:nth-child(4) { animation-delay: 0.83s; }
    .dot:nth-child(5) { animation-delay: 0.90s; }
    .lead     { animation: rise 1s var(--ease-out) 0.35s both; }
    .sig      { animation: fade 1.2s var(--ease-out) 1.4s both; }

<script>
/* ---------- пароль ----------
   GATE: true — сайт закрыт паролем, false — открыт всем.
   Пароль хранится как SHA-256, а не открытым текстом. Новый хэш: в консоли браузера
   crypto.subtle.digest("SHA-256", new TextEncoder().encode("1234")).then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("")))
   Это защита от случайных посетителей, а не от того, кто откроет код страницы. */
const GATE = true;
const GATE_HASH = "3d1e557b540ac045b3b327994a351f08a443f9216f9b2b8d3a0f42b58671ac83";
const GATE_DAYS = 30;   // сколько дней браузер помнит, что пароль введён

if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("fly");
window.gateReady = (function () {
  let remembered = false;
  try {
    const t = Number(localStorage.getItem("gate-ok") || 0);
    remembered = t > Date.now();
  } catch (e) {}
  if (!GATE || remembered) return Promise.resolve();
  document.documentElement.classList.add("locked");
  return new Promise((resolve) => {
    const run = () => initGate(resolve);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run, { once: true });
    else run();
  });
})();

function initGate(resolve) {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const label = document.getElementById("gate-label");
  const cells = [...gate.querySelectorAll(".gate-cell")];
  gate.hidden = false;

  // фон: строки «кода» из макета, каждая плывёт со своей скоростью
  const LINES = [
    'const noise_47 = [903, "сигнал", 0xF2]; // куда исчезли пиксели? поток 8841 → async dream() { return "неон_27" + Math.random(); }',
    '01001101 :: загрузка облаков... cache.moon = true; 7294 / 003 if (хаос > 42) { echo("ещё немного шума"); } else { sleep(808); }',
    'fragment_x9 = "тишина между строк"; null ?? 777; let orbit = []; // 82% случайности, 18% кофе — system.ready? maybe_404',
    'for (let искра = 0; искра < 913; искра++) { drift += "жж_07"; } alpha.beta[63] >> закат; 58.009; render({ fog: "ультрамарин" });',
    'ошибка_не_ошибка: 200 OK / 503 WOW / ping → пустота → pong { id: "q7v_92", мысль: undefined, скорость: 640, сон: false }',
    'вчера = tomorrow(17); // перепутаны координаты: x_882 y_003 sudo imagine --clouds 999 --цвет "электрический" --no-gravity',
    'r4nd0m.buffer += "шорох"; [8, 13, 21, 34].map(x => x * луна); >>> incoming: 7f:a9:02 / мягкий сбой / reconnect_in(314);',
    'while (ночь !== null) { звёзды.push(0xAB); break reality; } 273_901 / velvet.exe / undefined feelings / переменная_ёж = 56;',
    'await tinyExplosion("бах", { volume: 0.02 }); // всё под контролем matrix[19][84] = "пятница"; neon.flush(); 001101 → 110010;',
    'let zzz = "пыль на орбите"; checksum: 8B7F; entropy += 91; конец? false; restart_2048(); // продолжение где-то за скобкой };',
  ];
  const code = gate.querySelector(".gate-code");
  const lineH = Math.max(16, Math.min(27, innerWidth * 0.0187)) * 1.8;
  const rows = Math.ceil(innerHeight / lineH) + 2;
  for (let r = 0; r < rows; r++) {
    const row = document.createElement("div");
    row.className = "gate-row";
    const text = LINES[r % LINES.length];
    for (let k = 0; k < 4; k++) { const sp = document.createElement("span"); sp.textContent = text; row.appendChild(sp); }
    row.style.setProperty("--d", 70 + ((r * 37) % 60) + "s");
    row.style.setProperty("--x0", -((r * 13) % 30) + "%");
    code.appendChild(row);
  }

  const hash = async (v) => {
    if (!(window.crypto && crypto.subtle)) return null;
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  };

  let busy = false;
  const render = () => {
    const v = input.value;
    cells.forEach((c, i) => {
      c.classList.toggle("filled", i < v.length);
      c.classList.toggle("active", i === Math.min(v.length, 3) && v.length < 4);
    });
  };
  const fail = () => {
    gate.classList.add("error");
    label.textContent = "неверный пароль";
    setTimeout(() => {
      input.value = "";
      gate.classList.remove("error");
      label.textContent = "введите пароль";
      render();
      busy = false;
    }, 1100);
  };
  const pass = () => {
    try { localStorage.setItem("gate-ok", String(Date.now() + GATE_DAYS * 864e5)); } catch (e) {}
    gate.classList.add("ok");
    input.blur();
    setTimeout(() => {
      gate.classList.add("leaving");
      document.documentElement.classList.remove("locked");
      resolve();
      setTimeout(() => gate.remove(), 1400);
    }, 380);
  };
  const check = async () => {
    busy = true;
    const v = input.value;
    const h = await hash(v);
    // без crypto.subtle (страница открыта не по https) — сверяем напрямую
    const okay = h === null ? v === String.fromCharCode(49, 57, 57, 54) : h === GATE_HASH;
    okay ? pass() : fail();
  };

  input.addEventListener("input", () => {
    if (busy) { render(); return; }
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    render();
    if (input.value.length === 4) check();
  });
  input.addEventListener("focus", () => gate.classList.add("focused"));
  input.addEventListener("blur", () => gate.classList.remove("focused"));
  gate.addEventListener("pointerdown", (e) => { if (e.target !== input) { e.preventDefault(); input.focus(); } });
  gate.querySelector("form").addEventListener("submit", (e) => e.preventDefault());
  render();
  input.focus({ preventScroll: true });
}
</script>

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- WebGL: 3D-сцена ----------
   Камера стоит внутри цилиндра, карточки едут по его стенке.
   Передняя стенка на расстоянии D — там 1 px карточки = 1 px экрана.
   Боковые карточки ближе к камере: они крупнее, развёрнуты и уходят за неё. */
const NEAR = 8;

const VS = `
attribute vec2 aPos;
uniform vec2 uRes;
uniform vec2 uShift;
uniform float uF;
uniform float uRad;
uniform float uD;
uniform vec4 uCard;
uniform float uLift;
uniform float uEdgePad;
varying vec2 vLocal;
varying vec2 vUV;
varying float vFacing;
varying float vTheta;

void main() {
  // сетка чуть больше карточки: край рисуется сглаживанием внутри сетки, а не обрубается её границей
  vec2 local = (aPos - 0.5) * (uCard.zw + 2.0 * uEdgePad);
  float th = (uCard.x + local.x) / uRad;
  float r = uRad - uLift;
  vec3 P = vec3(r * sin(th), local.y + uCard.y, -(uD - uRad) - r * cos(th));
  float w = -P.z;
  vec3 N = vec3(-sin(th), 0.0, cos(th));
  vFacing = clamp(dot(N, normalize(-P)), 0.0, 1.0);
  vTheta = th;
  vLocal = local;
  vUV = local / uCard.zw + 0.5;
  gl_Position = vec4(
    (uF * P.x + uShift.x * w) / (uRes.x * 0.5),
    -(uF * P.y + uShift.y * w) / (uRes.y * 0.5),
    w - 2.0 * ${NEAR.toFixed(1)},
    w
  );
}`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;
uniform vec2 uHalf;
uniform float uR;
uniform vec4 uCover;
uniform float uAlpha;
uniform float uLight;   // 0 — карточка в темноте, 1 — освещена
uniform float uGlass;
varying vec2 vLocal;
varying vec2 vUV;
varying float vFacing;
varying float vTheta;

// углы со сглаживанием как corner smoothing 80% в Figma
const float SMOOTH_EXT = 1.6;
const float SMOOTH_N = 4.0;
float sdRR(vec2 p, vec2 b, float r) {
  float k = min(r * SMOOTH_EXT, min(b.x, b.y));
  vec2 q = abs(p) - b + k;
  vec2 c = max(q, 0.0) / k + 1e-5;
  float n = k * pow(pow(c.x, SMOOTH_N) + pow(c.y, SMOOTH_N), 1.0 / SMOOTH_N);
  return n + min(max(q.x, q.y), 0.0) - k;
}

vec3 sampleSplit(vec2 uv, vec2 off, float split) {
  vec2 s = uCover.xy;
  vec2 o = uCover.zw;
  float r = texture2D(uTex, (uv + off * (1.0 + split)) * s + o).r;
  float g = texture2D(uTex, (uv + off) * s + o).g;
  float b = texture2D(uTex, (uv + off * (1.0 - split)) * s + o).b;
  return vec3(r, g, b);
}

void main() {
  float d = sdRR(vLocal, uHalf, uR);
  #ifdef GL_OES_standard_derivatives
  float aa = max(fwidth(d) * 0.85, 0.35);
  #else
  float aa = 0.8;
  #endif
  float m = 1.0 - smoothstep(-aa, aa, d);
  if (m <= 0.0) discard;

  float e = smoothstep(0.0, 0.7, 1.0 - vFacing);   // 0 — смотрит в камеру, 1 — развёрнута боком

  vec2 h = vec2(1.0, 0.0);
  vec2 n = vec2(
    sdRR(vLocal + h.xy, uHalf, uR) - sdRR(vLocal - h.xy, uHalf, uR),
    sdRR(vLocal + h.yx, uHalf, uR) - sdRR(vLocal - h.yx, uHalf, uR)
  );
  n /= max(length(n), 1e-4);

  // стеклянная кромка: у края картинка втягивается внутрь и раскладывается на цвета
  float rimW = min(uHalf.x, uHalf.y) * 0.2;
  float rim = 1.0 - smoothstep(0.0, rimW, -d);
  float bend = rim * rim * uGlass * (0.35 + 0.65 * e);
  vec2 off = -n * bend * rimW * 0.55 / (2.0 * uHalf);
  vec3 col = sampleSplit(vUV, off, (0.15 + 0.45 * e) * rim);

  // свет слева сверху: развёрнутые от камеры карточки темнее,
  // по повёрнутым к свету проходит мягкий блик
  col *= mix(0.42, 1.0, pow(vFacing, 1.3));
  col *= uLight;
  float band = exp(-pow((vUV.x + vTheta * 1.35 - 1.3) * 2.2, 2.0)) * (1.0 - vUV.y * 0.55);
  col += band * 0.16;
  float light = 0.5 + 0.5 * dot(n, normalize(vec2(-0.45, -0.9)));
  float edgeLine = 1.0 - smoothstep(0.0, 2.5, -d);
  col += edgeLine * (0.06 + 0.3 * light) * (0.5 + 0.5 * e);
  col *= 1.0 - rim * rim * (1.0 - light) * 0.18;

  gl_FragColor = vec4(col * m, m) * uAlpha;
}`;

/* второй проход: смаз зависит от скорости. В покое — чисто, лишь лёгкая расфокусировка
   у самых близких к камере карточек. При свайпе и на входе — смаз по движению,
   лучи от центра, разложение на цвета, свечение. Зерно — всегда, едва заметное. */
const POST_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const POST_FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uScene;
uniform vec2 uPx;
uniform vec2 uC;
uniform float uSpeed;
uniform float uEdge;
uniform float uMotion;
uniform float uGlow;
uniform float uGrain;
uniform float uTime;
uniform sampler2D uBlur;   // та же сцена, уменьшенная в 16 раз — мягкий источник света
uniform float uRays;
uniform float uRayLen;
uniform float uHalo;
uniform float uAspect;
varying vec2 vUv;

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main() {
  vec4 sharp = texture2D(uScene, vUv);
  vec2 p = vUv - uC;
  float edge = smoothstep(0.3, 1.0, abs(vUv.x - 0.5) * 2.0);
  float sp = abs(uSpeed) * uMotion;
  float radial = uEdge * edge * edge + sp * 0.09 * (0.35 + edge);
  vec2 dir = vec2(uSpeed * uMotion * 0.06, 0.0);
  float mixK = clamp(edge * edge * 0.8 + sp * 1.6, 0.0, 1.0);

  vec3 col = sharp.rgb;
  float a = sharp.a;
  if (radial > 0.002 || sp > 0.01) {
    vec3 acc = vec3(0.0);
    float aa = 0.0;
    float wsum = 0.0;
    for (int i = 0; i < 18; i++) {
      float t = float(i) / 17.0;
      float w = 1.0 - 0.72 * t;
      vec4 r = texture2D(uScene, uC + p * (1.0 - radial * t) + dir * t);
      vec4 g = texture2D(uScene, uC + p * (1.0 - radial * t * 0.84) + dir * t * 0.84);
      vec4 b = texture2D(uScene, uC + p * (1.0 - radial * t * 0.68) + dir * t * 0.68);
      acc += vec3(r.r, g.g, b.b) * w;
      aa += (r.a + g.a + b.a) / 3.0 * w;
      wsum += w;
    }
    acc /= wsum;
    aa /= wsum;
    col = mix(sharp.rgb, acc, mixK) + acc * uGlow * (edge * edge * 0.4 + sp);
    a = mix(sharp.a, aa, mixK);
  }

  // свет: лучи от ленты в чёрный фон, ореол вокруг карточек и тень под ними
  float jit = 0.5;   // без попиксельного шума: источник света и так размыт, лучи выходят гладкими
  float side = smoothstep(0.4, 1.0, abs(vUv.x - 0.5) * 2.0);
  vec3 ray = vec3(0.0);
  float rw = 0.0;
  for (int i = 0; i < 28; i++) {
    float t = (float(i) + jit) / 28.0;
    vec3 c = texture2D(uBlur, uC + p * (1.0 - uRayLen * t)).rgb;
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    float w = 1.0 - t;
    ray += c * (0.4 + 1.6 * l) * w;
    rw += w;
  }
  ray /= rw;

  vec2 tx = vec2(uAspect, 1.0) * 0.018;
  vec3 halo = texture2D(uBlur, vUv).rgb * 0.25;
  vec4 h1 = texture2D(uBlur, vUv + vec2( tx.x, 0.0)) + texture2D(uBlur, vUv - vec2(tx.x, 0.0))
          + texture2D(uBlur, vUv + vec2(0.0,  tx.y)) + texture2D(uBlur, vUv - vec2(0.0, tx.y));
  vec4 h2 = texture2D(uBlur, vUv + tx * 2.0) + texture2D(uBlur, vUv - tx * 2.0)
          + texture2D(uBlur, vUv + vec2(tx.x, -tx.y) * 2.0) + texture2D(uBlur, vUv + vec2(-tx.x, tx.y) * 2.0);
  halo += h1.rgb * 0.125 + h2.rgb * 0.0625;

  float outside = 1.0 - sharp.a * 0.93;   // свет идёт вокруг карточек, а не поверх них
  vec3 light = ray * uRays * side * (1.0 + sp * 1.5) + halo * uHalo * (0.15 + 0.85 * side);
  col += light * outside;


  col += (hash(floor(vUv * uPx) + fract(uTime) * 61.0) - 0.5) * uGrain * a;
  a = clamp(max(a, max(col.r, max(col.g, col.b))), 0.0, 1.0);
  gl_FragColor = vec4(clamp(col, 0.0, a), a);
}`;

const DOWN_FS = `
precision mediump float;
uniform sampler2D uSrc;
uniform vec2 uTexel;
varying vec2 vUv;
void main() {
  gl_FragColor = 0.25 * (
    texture2D(uSrc, vUv + uTexel * vec2(-1.0, -1.0)) + texture2D(uSrc, vUv + uTexel * vec2(1.0, -1.0)) +
    texture2D(uSrc, vUv + uTexel * vec2(-1.0,  1.0)) + texture2D(uSrc, vUv + uTexel * vec2(1.0,  1.0)));
}`;

function startGL() {
  const gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: true });
  if (!gl) return false;

  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const link = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };
  const hasDeriv = !!gl.getExtension("OES_standard_derivatives");
  const prog = link(VS, (hasDeriv ? "#extension GL_OES_standard_derivatives : enable\n" : "") + FS);
  const post = link(POST_VS, POST_FS);
  const down = link(POST_VS, DOWN_FS);

  // сетка 48×6: по горизонтали карточка гнётся по цилиндру, по вертикали она прямая
  const NX = 48, NY = 6, verts = [], idx = [];
  for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) verts.push(i / NX, j / NY);
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const meshVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, meshVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  const meshIBO = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIBO);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  const quadVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, "aPos");
  const postPos = gl.getAttribLocation(post, "aPos");
  const downPos = gl.getAttribLocation(down, "aPos");
  const uSrc = gl.getUniformLocation(down, "uSrc"), uTexel = gl.getUniformLocation(down, "uTexel");
  const U = {}, P = {};
  ["uRes","uShift","uF","uRad","uD","uCard","uLift","uEdgePad","uTex","uHalf","uR","uCover","uAlpha","uGlass","uLight"]
    .forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
  ["uScene","uPx","uC","uSpeed","uEdge","uMotion","uGlow","uGrain","uTime","uBlur","uRays","uRayLen","uHalo","uAspect"]
    .forEach((n) => (P[n] = gl.getUniformLocation(post, n)));

  const makeTex = (source) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (source) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    return t;
  };

  // каждой работе — заглушка сразу, настоящий файл подменяет её, когда загрузится
  const items = WORKS.map((w, i) => ({ tex: makeTex(drawPlaceholder(w, i)), aspect: TEX_W / TEX_H, video: null }));
  WORKS.forEach((w, i) => {
    if (!w.src) return;
    const it = items[i];
    const upload = (source, aspect) => {
      try {
        gl.bindTexture(gl.TEXTURE_2D, it.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
        it.aspect = aspect;
        return true;
      } catch (err) {
        console.warn("Не удалось показать " + w.src + ". Открой сайт через локальный сервер, а не двойным кликом по файлу.", err);
        return false;
      }
    };
    if (/\.(mp4|webm|mov)$/i.test(w.src)) {
      const v = document.createElement("video");
      Object.assign(v, { muted: true, loop: true, playsInline: true, autoplay: true, preload: "auto" });
      v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
      v.addEventListener("loadeddata", () => {
        if (upload(v, v.videoWidth / v.videoHeight)) it.video = v;
        v.play().catch(() => {});
      }, { once: true });
      v.src = w.src;
    } else {
      const img = new Image();
      img.onload = () => upload(img, img.naturalWidth / img.naturalHeight);
      img.src = w.src;
    }
  });

  // кадр сцены рисуется в текстуру, второй проход добавляет смаз
  const fbTex = makeTex(null);
  const fb = gl.createFramebuffer();
  // уменьшенные копии кадра: 1/4 и 1/16 — из них свет, лучи и тени
  const small = [4, 16].map((k) => ({ k, tex: makeTex(null), fb: gl.createFramebuffer(), w: 1, h: 1 }));

  let cssW = 0, cssH = 0, shiftX = 0, shiftY = 0;
  const resize = () => {
    measure();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = canvas.clientWidth; cssH = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    gl.bindTexture(gl.TEXTURE_2D, fbTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    for (const sm of small) {
      sm.w = Math.max(1, Math.round(canvas.width / sm.k));
      sm.h = Math.max(1, Math.round(canvas.height / sm.k));
      gl.bindTexture(gl.TEXTURE_2D, sm.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sm.w, sm.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sm.fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sm.tex, 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const c = canvas.getBoundingClientRect(), r = reel.getBoundingClientRect();
    shiftX = r.left + r.width / 2 - (c.left + c.width / 2);
    shiftY = r.top + r.height / 2 - (c.top + c.height / 2);
  };
  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  ro.observe(reel);
  resize();

  // геометрия камеры: от ширины экрана, на телефоне изгиб мягче
  const camera = () => {
    const D = cssW * (cssW < 700 ? 0.95 : SETTINGS.depth);
    return { D, F: D, R0: D * (cssW < 700 ? 0.75 : SETTINGS.curve) };
  };

  // прокрутка: авто + перетаскивание и трекпад с инерцией
  const intro = reduceMotion ? 0 : 1;
  let offset = 0, velocity = 0, hover = false, drag = null, last = performance.now();
  let introStart = null, introDone = !intro;
  const baseSpeed = reduceMotion ? 0 : SETTINGS.speed;
  let pointerX = null;

  const trackPointer = (e) => {
    if (e.pointerType !== "mouse") return;
    const r = canvas.getBoundingClientRect();
    pointerX = e.clientX - r.left - r.width / 2;
  };
  reel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") hover = true; trackPointer(e); });
  reel.addEventListener("pointerleave", () => { hover = false; pointerX = null; });
  reel.addEventListener("pointermove", trackPointer);
  let press = null;
  reel.addEventListener("pointerup", (e) => {
    // короткое нажатие без сдвига — открыть работу
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6 && performance.now() - press.t < 450) {
      const k = window.__reel.at(e.clientX);
      if (k !== null && !WORKS[window.__reel.item(k)].nda) openViewer(k);
    }
    press = null;
  });
  reel.addEventListener("pointerdown", (e) => {
    press = { x: e.clientX, y: e.clientY, t: performance.now() };
    drag = { x: e.clientX, t: performance.now(), id: e.pointerId };
    velocity = 0;
    reel.setPointerCapture(e.pointerId);
    reel.classList.add("dragging");
  });
  reel.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now();
    const dx = e.clientX - drag.x;
    offset -= dx;
    velocity = -dx / Math.max(1, now - drag.t) * 1000;
    drag.x = e.clientX; drag.t = now;
  });
  const endDrag = () => { drag = null; reel.classList.remove("dragging"); };
  reel.addEventListener("pointerup", endDrag);
  reel.addEventListener("pointercancel", endDrag);
  reel.addEventListener("wheel", (e) => {
    let dx = e.deltaX;
    if (Math.abs(dx) <= Math.abs(e.deltaY)) {
      if (!e.shiftKey) return;
      dx = e.deltaY;
    }
    if (e.deltaMode === 1) dx *= 16;
    else if (e.deltaMode === 2) dx *= cssW;
    e.preventDefault();
    offset += dx;
    velocity = 0;
  }, { passive: false });
  reel.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const k = window.__reel.at(window.innerWidth / 2); if (k !== null && !WORKS[window.__reel.item(k)].nda) openViewer(k); return; }
    if (e.key === "ArrowRight") { velocity += 1400; e.preventDefault(); }
    if (e.key === "ArrowLeft") { velocity -= 1400; e.preventDefault(); }
  });

  let visible = true;
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; last = performance.now(); });

  const hoverAmt = new Map();
  let speedSm = 0, prevOffset = 0;

  // связь с просмотрщиком: какую карточку скрыть, куда доехать лентой, где карточка на экране
  let hiddenK = null, snapTo = null, slow = false;
  let lastList = [], lastScreenX = null, lastCam = null, lastR = 1, lastCount = 1, lastPitch = 1;
  const toClientX = (x) => canvas.getBoundingClientRect().left + cssW / 2 + x;
  window.__reel = {
    count: () => items.length,
    // карточка под точкой экрана
    at(clientX) {
      const r = canvas.getBoundingClientRect();
      const x = clientX - r.left - r.width / 2;
      for (const c of lastList) {
        if (Math.abs(c.s / lastR) > 1.1) continue;
        const l = lastScreenX(c.s - card.w / 2), rr = lastScreenX(c.s + card.w / 2);
        if (l !== null && rr !== null && l <= x && x <= rr) return c.k;
      }
      return null;
    },
    item: (k) => k % items.length,
    // прямоугольник карточки на экране
    rect(k) {
      const c = lastList.find((c) => c.k === k);
      if (!c) return null;
      const l = lastScreenX(c.s - card.w / 2), rr = lastScreenX(c.s + card.w / 2);
      if (l === null || rr === null) return null;
      const th = c.s / lastR;
      const depth = lastCam.D - lastR + lastR * Math.cos(th);
      const h = card.h * lastCam.F / depth;
      const top = canvas.getBoundingClientRect().top + cssH / 2 + shiftY - h / 2;
      return { left: toClientX(l), top, width: rr - l, height: h, radius: card.r * lastCam.F / depth };
    },
    hide(k) { hiddenK = k; },
    show() { hiddenK = null; },
    center(k) {
      const c = lastList.find((c) => c.k === k);
      if (c) snapTo = offset + c.s;
    },
    step(k, dir) {
      if (snapTo === null) snapTo = offset;
      snapTo += dir * lastPitch;
      return (k + dir + lastCount) % lastCount;
    },
    release() { snapTo = null; },
    setSlow(v) { slow = v; },
  };

  const frame = (now) => {
    requestAnimationFrame(frame);
    if (!visible) return;
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;

    // вход: лента проявляется из темноты ровной полосой, потом края загибаются в линзу
    if (introStart === null) {
      introStart = now;
      prevOffset = offset;
    }
    const since = (now - introStart) / 1000;

    if (snapTo !== null) {
      // просмотрщик открыт: лента плавно доезжает до выбранной работы
      offset += (snapTo - offset) * (1 - Math.exp(-dt * 6));
      velocity = 0;
    } else if (!drag) {
      offset += velocity * dt;
      velocity *= Math.pow(0.04, dt);
      if (Math.abs(velocity) < 2) velocity = 0;
      offset += baseSpeed * (slow ? 0.1 : hover ? SETTINGS.hoverSpeed : 1) * dt;
    }

    // скорость для эффектов: сглаженная, от −1 до 1
    const raw = (offset - prevOffset) / dt;
    prevOffset = offset;
    speedSm += (raw - speedSm) * (1 - Math.exp(-dt * 7));
    const speed = Math.max(-1, Math.min(1, speedSm / 3200));
    const sp = Math.abs(speed);

    for (const it of items) {
      if (it.video && it.video.readyState >= 2) {
        gl.bindTexture(gl.TEXTURE_2D, it.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, it.video);
      }
    }

    const cam = camera();
    const since0 = (now - introStart) / 1000;
    const tl = (a, b) => (intro ? Math.min(1, Math.max(0, (since0 - a) / (b - a))) : 1);
    const ease = (t) => 1 - Math.pow(1 - t, 4);
    const easeIO = (t) => (t < 0.5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2);
    const lightUp = ease(tl(INTRO.reelStart, INTRO.reelStart + 1.2));
    const bendT = easeIO(tl(INTRO.reelStart + 0.9, INTRO.reelStart + 2.3));
    // ровная полоса = цилиндр огромного радиуса; изгиб — радиус уменьшается до рабочего
    const bendR = cam.R0 / Math.max(0.02, bendT);
    const R = Math.min(bendR, cam.R0 * 60) * (1 - 0.22 * sp);    // на скорости цилиндр сжимается
    const pitch = card.w + card.gap;
    // не рисуем карточки, которые подошли к камере ближе трети расстояния до передней стенки:
    // они уже за краем кадра, а вблизи заливают весь экран
    const maxTh = Math.acos(Math.max(-1, Math.min(1, (cam.D * 0.33 - (cam.D - R)) / R)));
    const arc = maxTh * R;
    const reps = Math.max(1, Math.min(40, Math.ceil(Math.min(2 * Math.PI * R, arc * 2 + cssW * 2) / (pitch * items.length))));
    const count = reps * items.length;
    const total = count * pitch;

    const screenX = (s) => {
      const th = s / R;
      const w = cam.D - R + R * Math.cos(th);
      return w > NEAR ? cam.F * R * Math.sin(th) / w + shiftX : null;
    };

    const list = [];
    for (let k = 0; k < count; k++) {
      let s = k * pitch - offset;
      s = ((s % total) + total) % total;
      if (s >= total / 2) s -= total;
      if (Math.abs(s) - card.w / 2 > arc) continue;
      list.push({ s, k, it: items[k % items.length] });
    }

    lastList = list; lastScreenX = screenX; lastCam = cam; lastR = R; lastCount = count; lastPitch = pitch;
    let hovered = -1;
    if (pointerX !== null && !drag && sp < 0.15 && !slow) {
      for (const c of list) {
        if (Math.abs(c.s / R) > 1.1) continue;
        const l = screenX(c.s - card.w / 2), r = screenX(c.s + card.w / 2);
        if (l !== null && r !== null && l <= pointerX && pointerX <= r) { hovered = c.k; break; }
      }
    }
    reel.style.cursor = hovered >= 0 && !WORKS[hovered % items.length].nda ? "pointer" : "";
    const fade = introDone ? 1 : tl(INTRO.reelStart - 0.1, INTRO.reelStart + 0.5);
    if (fade >= 1) introDone = true;
    for (const c of list) {
      const prev = hoverAmt.get(c.k) || 0;
      const h = prev + ((c.k === hovered ? 1 : 0) - prev) * (1 - Math.exp(-dt * 9));
      if (h > 0.001) hoverAmt.set(c.k, h); else hoverAmt.delete(c.k);
      c.h = h;
    }
    // дальние (в центре) рисуются первыми, ближние к камере — поверх
    list.sort((a, b) => Math.abs(a.s) - Math.abs(b.s));

    // проход 1: сцена в текстуру
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, meshVBO);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIBO);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindTexture(gl.TEXTURE_2D, items[0].tex);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform2f(U.uRes, cssW, cssH);
    gl.uniform2f(U.uShift, shiftX, shiftY);
    gl.uniform1f(U.uF, cam.F);
    gl.uniform1f(U.uRad, R);
    gl.uniform1f(U.uD, cam.D);
    gl.uniform1f(U.uGlass, SETTINGS.glass);
    gl.uniform1f(U.uEdgePad, 3);
    gl.uniform1f(U.uAlpha, fade);
    gl.uniform1f(U.uLight, 0.04 + 0.96 * lightUp);
    const cardAspect = card.w / card.h;
    for (const c of list) {
      if (c.k === hiddenK) continue;
      const it = c.it;
      let sx = 1, sy = 1;
      if (it.aspect > cardAspect) sx = cardAspect / it.aspect; else sy = it.aspect / cardAspect;
      const sc = 1 + 0.03 * c.h;
      gl.uniform4f(U.uCover, sx, sy, (1 - sx) / 2, (1 - sy) / 2);
      gl.uniform4f(U.uCard, c.s, -c.h * card.h * 0.02, card.w * sc, card.h * sc);
      gl.uniform1f(U.uLift, c.h * card.w * 0.1);
      gl.uniform2f(U.uHalf, card.w * sc / 2, card.h * sc / 2);
      gl.uniform1f(U.uR, card.r * sc);
      gl.bindTexture(gl.TEXTURE_2D, it.tex);
      gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
    }

    // проход 2: кадр уменьшается в 4, потом в 16 раз — получается мягкое размытие для света
    gl.disable(gl.BLEND);
    gl.useProgram(down);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
    gl.enableVertexAttribArray(downPos);
    gl.vertexAttribPointer(downPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1i(uSrc, 0);
    let src = fbTex, sw = canvas.width, shh = canvas.height;
    for (const sm of small) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, sm.fb);
      gl.viewport(0, 0, sm.w, sm.h);
      gl.bindTexture(gl.TEXTURE_2D, src);
      gl.uniform2f(uTexel, 1 / sw, 1 / shh);
      if (sm.k === 16) {
        // карта света копится во времени: новый кадр смешивается с прошлыми, свет не мерцает
        gl.enable(gl.BLEND);
        gl.blendColor(0, 0, 0, 0.22);
        gl.blendFunc(gl.CONSTANT_ALPHA, gl.ONE_MINUS_CONSTANT_ALPHA);
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disable(gl.BLEND);
      src = sm.tex; sw = sm.w; shh = sm.h;
    }

    // проход 3: смаз, дисперсия, лучи, ореол, тень, зерно
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(post);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
    gl.enableVertexAttribArray(postPos);
    gl.vertexAttribPointer(postPos, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, small[1].tex);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fbTex);
    gl.uniform1i(P.uScene, 0);
    gl.uniform1i(P.uBlur, 1);
    gl.uniform1f(P.uRays, SETTINGS.rays * bendT * lightUp);
    gl.uniform1f(P.uRayLen, SETTINGS.rayLength);
    gl.uniform1f(P.uHalo, SETTINGS.halo * lightUp);
    gl.uniform1f(P.uAspect, cssH / cssW);
    gl.uniform2f(P.uPx, canvas.width, canvas.height);
    gl.uniform2f(P.uC, 0.5 + shiftX / cssW, 0.5 - shiftY / cssH);
    gl.uniform1f(P.uSpeed, speed);
    gl.uniform1f(P.uEdge, SETTINGS.edgeBlur * bendT);
    gl.uniform1f(P.uMotion, SETTINGS.motionBlur);
    gl.uniform1f(P.uGlow, SETTINGS.glow);
    gl.uniform1f(P.uGrain, SETTINGS.grain);
    gl.uniform1f(P.uTime, now / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  requestAnimationFrame(frame);
  return true;
}

/* ---------- просмотр работы ----------
   клик по карточке: она вылетает из ленты и разворачивается в экран телефона,
   справа описание и кнопка. Курсор — стрелка: клик справа листает вперёд, слева — назад */
const viewer = document.getElementById("viewer");
const vMedia = viewer.querySelector(".viewer-media");
const vInner = viewer.querySelector(".viewer-media-inner");
const vSlot = viewer.querySelector(".viewer-slot");
const vInfo = viewer.querySelector(".viewer-info");
const vTitle = viewer.querySelector(".viewer-title");
const vDesc = viewer.querySelector(".viewer-desc");
const vCta = viewer.querySelector(".viewer-cta");
const vClose = viewer.querySelector(".viewer-close");
const vCursor = viewer.querySelector(".viewer-cursor");
viewer.tabIndex = -1;
vCta.href = CONTACT_URL;

const EXPO = "cubic-bezier(0.16, 1, 0.3, 1)";
const dur = (ms) => (reduceMotion ? 1 : ms);
const isVideo = (src) => /\.(mp4|webm|mov)$/i.test(src || "");
const phCache = new Map();
const placeholderURL = (i) => {
  // в пропорциях экрана телефона (375 × 812), чтобы заглушка не обрезалась
  if (!phCache.has(i)) phCache.set(i, drawPlaceholder(WORKS[i], i, Math.round(TEX_W * 812 / 375)).toDataURL("image/jpeg", 0.9));
  return phCache.get(i);
};

let vState = null;
let lastFocus = null;

function fillMedia(i) {
  const w = WORKS[i];
  const src = w.full || w.src;
  vInner.textContent = "";
  // пока грузится видео, под ним та же картинка, что на карточке в ленте
  const still = w.poster || (w.src && !isVideo(w.src) ? w.src : placeholderURL(i));
  vInner.style.backgroundImage = `url("${still}"), url("${placeholderURL(i)}")`;
  const toPlaceholder = (el) => {
    const img = document.createElement("img");
    img.alt = "";
    img.src = placeholderURL(i);
    el.replaceWith(img);
  };
  let el;
  if (isVideo(src)) {
    el = document.createElement("video");
    Object.assign(el, { muted: true, loop: true, playsInline: true, autoplay: true, preload: "auto" });
    el.setAttribute("muted", "");
    el.setAttribute("playsinline", "");
    if (w.poster) el.poster = w.poster;
    el.addEventListener("error", () => toPlaceholder(el), { once: true });
    el.src = src;
    el.play().catch(() => {});
  } else {
    el = document.createElement("img");
    el.alt = "";
    if (src) {
      el.addEventListener("error", () => { el.src = placeholderURL(i); }, { once: true });
      el.src = src;
    } else el.src = placeholderURL(i);
  }
  vInner.appendChild(el);
}

function fillInfo(i) {
  const w = WORKS[i];
  vTitle.textContent = w.title + ", " + w.meta;
  vDesc.textContent = w.desc || "";
  viewer.setAttribute("aria-label", w.title);
}

function setScale() {
  const k = Math.min(1, innerHeight / 1024, (innerWidth / 1440) * 1.12);
  viewer.style.setProperty("--k", k.toFixed(3));
}
const slotRect = () => {
  const r = vSlot.getBoundingClientRect();
  const k = parseFloat(viewer.style.getPropertyValue("--k")) || 1;
  return { left: r.left, top: r.top, width: r.width, height: r.height, radius: innerWidth <= 700 ? 26 : 40 * k };
};
const mediaRect = () => {
  const r = vMedia.getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height, radius: parseFloat(getComputedStyle(vMedia).borderTopLeftRadius) || 0 };
};
const rectKF = (r) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: r.radius + "px" });
function setRect(r) { Object.assign(vMedia.style, rectKF(r)); }
function morph(from, to, ms, easing) {
  const a = vMedia.animate([rectKF(from), rectKF(to)], { duration: dur(ms), easing, fill: "forwards" });
  return a.finished.then(() => { setRect(to); a.cancel(); });
}

function sourceRect(st) {
  const api = window.__reel;
  if (api && st.k !== null) return api.rect(st.k);
  if (st.el && st.el.isConnected) {
    const r = st.el.getBoundingClientRect();
    return { left: r.left, top: r.top, width: r.width, height: r.height, radius: r.width * 0.2 };
  }
  return null;
}

function openViewer(k, el) {
  if (vState) return;
  const api = el ? null : window.__reel;
  const i = api ? api.item(k) : k;
  vState = { k: api ? k : null, i, el: el || null, busy: true };
  setScale();
  fillMedia(i);
  fillInfo(i);
  viewer.hidden = false;
  viewer.classList.remove("closing");
  const from = sourceRect(vState) || { ...slotRect(), radius: 40 };
  setRect(from);
  vInner.style.transform = "";
  if (api) { api.hide(k); api.center(k); api.setSlow(true); }
  lastFocus = document.activeElement;
  void viewer.offsetWidth;
  viewer.classList.add("open");
  viewer.focus({ preventScroll: true });
  morph(from, slotRect(), 900, EXPO).then(() => { if (vState) vState.busy = false; });
}

function closeViewer() {
  if (!vState || vState.busy) return;
  const st = vState;
  st.busy = true;
  viewer.classList.add("closing");
  viewer.classList.remove("open");
  vInner.style.transform = "";
  const from = mediaRect();
  const to = sourceRect(st);
  const done = () => {
    const api = window.__reel;
    if (api) { api.show(); api.release(); api.setSlow(false); }
    viewer.hidden = true;
    viewer.classList.remove("closing", "has-cursor", "over-ui");
    vInner.textContent = "";
    vMedia.style.opacity = "";
    vState = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  };
  if (to) morph(from, to, 700, "cubic-bezier(0.65, 0, 0.25, 1)").then(done);
  else vMedia.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur(300), fill: "forwards" }).finished.then(done);
}

async function navigate(dir) {
  if (!vState || vState.busy) return;
  const st = vState;
  st.busy = true;
  const n = WORKS.length;
  const api = window.__reel;
  // карточки NDA пропускаем: открыть их нельзя
  let steps = 1;
  while (steps < n && WORKS[(st.i + dir * steps + n * steps) % n].nda) steps++;
  if (api && st.k !== null) {
    for (let j = 0; j < steps; j++) st.k = api.step(st.k, dir);
    api.hide(st.k);
  }
  st.i = (st.i + dir * steps + n * steps) % n;
  vInfo.classList.add("swap");
  vInner.style.transform = "";
  const out = vInner.animate(
    [{ transform: "none", opacity: 1, filter: "blur(0px)" },
     { transform: `translateX(${-dir * 9}%) scale(0.94)`, opacity: 0, filter: "blur(12px)" }],
    { duration: dur(280), easing: "cubic-bezier(0.5, 0, 0.75, 0)", fill: "forwards" });
  await out.finished;
  fillMedia(st.i);
  fillInfo(st.i);
  out.cancel();
  const inn = vInner.animate(
    [{ transform: `translateX(${dir * 9}%) scale(0.94)`, opacity: 0, filter: "blur(12px)" },
     { transform: "none", opacity: 1, filter: "blur(0px)" }],
    { duration: dur(700), easing: EXPO });
  requestAnimationFrame(() => vInfo.classList.remove("swap"));
  await inn.finished;
  st.busy = false;
}

// курсор-стрелка с мягким догоном
let cur = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, raf: 0 };
const cursorLoop = () => {
  cur.x += (cur.tx - cur.x) * 0.28;
  cur.y += (cur.ty - cur.y) * 0.28;
  vCursor.style.transform = `translate3d(${cur.x}px, ${cur.y}px, 0)`;
  cur.raf = vState ? requestAnimationFrame(cursorLoop) : 0;
};
const sideOf = (x) => (x < innerWidth * 0.35 ? -1 : 1);

viewer.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  if (!viewer.classList.contains("has-cursor")) { cur.x = e.clientX; cur.y = e.clientY; viewer.classList.add("has-cursor"); }
  cur.tx = e.clientX; cur.ty = e.clientY;
  if (!cur.raf) cur.raf = requestAnimationFrame(cursorLoop);
  vCursor.classList.toggle("prev", sideOf(e.clientX) < 0);
  viewer.classList.toggle("over-ui", !!e.target.closest(".viewer-cta, .viewer-close"));
  // экран телефона слегка поворачивается за курсором
  if (vState && !vState.busy && !reduceMotion) {
    const r = vMedia.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
    const dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
    vInner.style.transform = `rotateY(${(dx * 10).toFixed(2)}deg) rotateX(${(-dy * 8).toFixed(2)}deg)`;
  }
});

let swipe = null, skipClick = false;
viewer.addEventListener("pointerdown", (e) => {
  vCursor.classList.add("press");
  swipe = e.pointerType === "mouse" ? null : { x: e.clientX, y: e.clientY };
});
viewer.addEventListener("pointerup", (e) => {
  vCursor.classList.remove("press");
  if (swipe) {
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { navigate(dx < 0 ? 1 : -1); skipClick = true; }
    swipe = null;
  }
});
viewer.addEventListener("click", (e) => {
  if (skipClick) { skipClick = false; return; }
  if (e.target.closest(".viewer-cta")) return;
  if (e.target.closest(".viewer-close")) { closeViewer(); return; }
  navigate(sideOf(e.clientX));
});
document.addEventListener("keydown", (e) => {
  if (!vState) return;
  if (e.key === "Escape") { e.preventDefault(); closeViewer(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); navigate(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); navigate(-1); }
  else if (e.key === "Tab") {
    const f = [vCta, vClose];
    const at = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(at + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
  }
});
addEventListener("resize", () => {
  if (!vState || vState.busy) return;
  setScale();
  setRect(slotRect());
});

/* ---------- вход «сборка» ----------
   каждая буква прилетает из случайной точки за экраном, кувыркаясь и в размытии.
   В полёте буква набрана «чужим» шрифтом — у заголовка моноширинным, у подзаголовка антиквой —
   и на подлёте превращается в свой. Иконки слетаются так же. Потом всё возвращается в исходную вёрстку */
function playLettersIntro() {
  const root = document.documentElement;
  if (!INTRO.letters || reduceMotion || !root.classList.contains("fly")) {
    root.classList.remove("fly");
    return;
  }
  const h1 = document.querySelector(".headline");
  const lead = document.querySelector(".lead");
  const saved = [[h1, h1.innerHTML], [lead, lead.innerHTML]];
  const serif = getComputedStyle(h1).fontFamily;
  const mono = getComputedStyle(lead).fontFamily;

  const split = (el, flyFont, landFont, opts) => {
    const out = [];
    const walk = (node) => {
      for (const n of [...node.childNodes]) {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const chr of n.textContent) {
            if (/\s/.test(chr)) { frag.appendChild(document.createTextNode(chr)); continue; }
            const outer = document.createElement("span");
            outer.className = "ch";
            outer.textContent = chr;
            const fly = document.createElement("i");
            fly.textContent = chr;
            fly.setAttribute("aria-hidden", "true");
            outer.appendChild(fly);
            frag.appendChild(outer);
            out.push(fly);
          }
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && !n.classList.contains("inline-media")) walk(n);
      }
    };
    walk(el);
    const H = el.offsetHeight || 1;
    out.forEach((fly) => {
      const t = fly.parentNode.offsetTop / H;
      if (opts.gradient) fly.style.color = `rgba(255,255,255,${(1 - 0.5 * Math.min(1, t + 0.15)).toFixed(3)})`;
      Object.assign(fly, { _flyFont: flyFont, _landFont: landFont, _blur: opts.blur, _spread: opts.spread, _lead: opts.lead });
    });
    return out;
  };

  const heads = split(h1, mono, serif, { gradient: true, blur: true, spread: 1, lead: false });
  const leads = split(lead, serif, mono, { gradient: false, blur: false, spread: 0.7, lead: true });
  const icons = [...document.querySelectorAll(".me, .dot")];
  root.classList.add("flying");
  root.classList.remove("fly");

  const W = innerWidth, Hh = innerHeight, far = Math.max(W, Hh);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const from = (el, spread) => {
    const r = el.getBoundingClientRect();
    const ang = rnd(0, Math.PI * 2);
    const dist = far * rnd(0.55, 1.15) * spread;
    const tx = W / 2 + Math.cos(ang) * dist - (r.left + r.width / 2);
    const ty = Hh / 2 + Math.sin(ang) * dist * 0.8 - (r.top + r.height / 2);
    return `translate(${tx.toFixed(0)}px, ${ty.toFixed(0)}px) rotate(${rnd(-260, 260).toFixed(0)}deg) scale(${rnd(0.35, 2.6).toFixed(2)})`;
  };

  const anims = [];
  const EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
  heads.concat(leads).forEach((fly) => {
    const delay = (fly._lead ? 0.35 : 0) + rnd(0, fly._lead ? 0.55 : 0.6);
    const duration = rnd(1.25, 1.85) * (fly._lead ? 0.85 : 1);
    const blur0 = fly._blur ? "blur(10px)" : "blur(0px)";
    anims.push(fly.animate([
      { offset: 0, transform: from(fly.parentNode, fly._spread), opacity: 0, filter: blur0, fontFamily: fly._flyFont },
      { offset: 0.12, opacity: 1 },
      { offset: 0.72, fontFamily: fly._flyFont },
      { offset: 0.73, fontFamily: fly._landFont },
      { offset: 1, transform: "none", opacity: 1, filter: "blur(0px)", fontFamily: fly._landFont },
    ], { duration: duration * 1000, delay: delay * 1000, easing: EASE, fill: "backwards" }));
  });
  icons.forEach((el) => {
    anims.push(el.animate([
      { transform: from(el, 1), opacity: 0, filter: "blur(8px)" },
      { offset: 0.15, opacity: 1 },
      { transform: "none", opacity: 1, filter: "blur(0px)" },
    ], { duration: rnd(1.3, 1.8) * 1000, delay: rnd(0.15, 0.6) * 1000, easing: EASE, fill: "backwards" }));
  });

  Promise.all(anims.map((a) => a.finished)).catch(() => {}).then(() => {
    // возвращаем обычную вёрстку: градиент заголовка, ховеры иконок
    saved.forEach(([el, html]) => (el.innerHTML = html));
    root.classList.remove("flying");
    document.querySelectorAll("img[data-slot]").forEach((img) => {
      if (img.complete && img.naturalWidth === 0) { img.parentElement.classList.add("empty"); img.remove(); }
    });
  });
}

/* ---------- запасной вариант без WebGL: обычная бегущая строка ---------- */
function startFallback() {
  canvas.remove();
  const track = document.createElement("div");
  track.className = "reel-fallback";
  reel.style.setProperty("--card-w", card.w + "px");
  const make = () => WORKS.forEach((w, i) => {
    const img = document.createElement("img");
    img.alt = w.title;
    img.src = drawPlaceholder(w, i).toDataURL("image/jpeg", 0.85);
    img.addEventListener("click", () => openViewer(i, img));
    track.appendChild(img);
  });
  make(); make();
  reel.appendChild(track);
}

const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load('76px "Instrument Serif"'),
    document.fonts.load('22px "Roboto Mono"'),
  ]),
  new Promise((r) => setTimeout(r, 1500)),
]);

Promise.all([fontsReady, window.gateReady]).then(() => {
  playLettersIntro();
  let ok = false;
  try { ok = startGL(); } catch (e) { console.warn(e); }
  if (!ok) startFallback();
});
</script>
